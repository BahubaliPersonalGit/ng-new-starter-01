name: Anguler Docker Deploy
on:
  push:
    branches:
      - main

jobs:
  call:
    uses: ./.github/workflows/docker-build-template.yml
    with:
      registry: ghcr.io
      image_name: ${{ github.repository }}
      node_versions: '["18","20"]'
      push: true
      tags: '["latest"]'
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

